<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3E6D3">
<title>Trilha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Shippori+Mincho+B1:wght@600;800&family=Gloock&family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TRILHA · tokens base (fixos) ============ */
:root{
  --font-body:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:30px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px;
  --ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.3,1.7,.5,1);
  --gutter:clamp(16px,4vw,56px);--maxw:1280px;
  /* tokens de tema (sobrescritos por [data-theme]) */
  --bg:#F3E6D3;--ink:#2A1712;--mute:#6B4F43;--line:rgba(42,23,18,.18);
  --acc:#C8452C;--acc2:#E8A33D;--acc3:#B5246B;--deep:#17403C;--on-deep:#F7EFE3;--on-acc:#FFF6EA;--route:#E8A33D;
  --fg-acc:#fff;--fg-acc2:#141414;--fg-acc3:#fff;--card:#fff;--soft:rgba(255,255,255,.6);
  --font-display:'Bricolage Grotesque','Arial Black',sans-serif;--display-weight:800;
  --motif:polygon(50% 0%,100% 50%,50% 100%,0% 50%);--motif-solid:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;transition:background .5s,color .5s;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:-.03em}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter) 110px}
.motif{clip-path:var(--motif);display:inline-block}

/* ============ fundo vivo ============ */
.bg-pattern{position:fixed;inset:0;opacity:.06;pointer-events:none;z-index:0}
.bg-pattern svg{width:100%;height:100%}
.grain{position:fixed;inset:-10%;width:120%;height:120%;pointer-events:none;opacity:.09;mix-blend-mode:multiply;z-index:60;animation:grain 1.2s steps(3) infinite}
[data-dark] .grain{mix-blend-mode:screen;opacity:.05}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floater{position:absolute;will-change:transform}
.wrap>.floaters{z-index:-1}
.floater i{display:block;width:100%;height:100%;clip-path:var(--motif);animation:floaty 8s ease-in-out infinite}

/* ============ header / nav ============ */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:12px var(--gutter);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:var(--display-weight);font-size:24px}
.logo .motif{width:18px;height:18px;background:var(--acc);animation:wig 3.4s ease-in-out infinite}
.nav{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line)}
.nav a{padding:10px 16px;border-radius:var(--r-pill);font-size:14px;font-weight:500;text-decoration:none;transition:background .25s,color .25s}
.nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
.idpill{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 10px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.dots{display:flex}.dots span{width:18px;height:18px;border-radius:50%;margin-left:-6px;border:1.5px solid var(--card)}.dots span:first-child{margin-left:0}
.idmenu{position:absolute;right:var(--gutter);top:64px;min-width:260px;padding:8px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.15);display:none;flex-direction:column;gap:2px;z-index:70}
.idmenu.open{display:flex;animation:popin .35s var(--ease-spring) both}
.idmenu button,.idmenu a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;border-radius:var(--r-md);background:transparent;cursor:pointer;text-align:left;text-decoration:none;font-size:15px}
.idmenu button:hover,.idmenu a:hover{background:var(--soft)}
.idmenu .sw{width:22px;height:22px;flex:none}
.tabbar{display:none}
@media (max-width:820px){
  .top .nav{display:none}
  .idpill .lbl{display:none}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:14px;z-index:55;justify-content:space-around;padding:7px;background:var(--deep);border-radius:26px;box-shadow:0 5px 0 var(--acc)}
  .tabbar a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:20px;text-decoration:none;font-size:11px;font-weight:600;color:var(--on-deep)}
  .tabbar a[aria-current=page]{background:var(--acc2);color:var(--fg-acc2)}
  .wrap{padding-bottom:140px}
}

/* ============ componentes ============ */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 22px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--acc);color:var(--fg-acc);border-color:var(--acc)}
.btn-ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-ghost{background:transparent;border-color:var(--ink)}
.chip{flex:none;min-height:46px;padding:0 18px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip small{font-family:var(--font-mono);font-size:12px;opacity:.7;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl)}
.ai{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--soft);border:1px solid var(--line);line-height:1.5}
.ai-tag{flex:none;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;padding:4px 7px;border-radius:6px;background:var(--acc);color:var(--fg-acc)}
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;padding:3px 7px;border-radius:6px;border:1px solid var(--acc)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.field input,.field select,.field textarea{min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.field textarea{padding:14px;resize:vertical}
.lift{transition:transform .35s var(--ease-spring),box-shadow .35s}
.lift:hover{transform:translateY(-6px) rotate(-.8deg);box-shadow:6px 8px 0 currentColor}
.tap{transition:transform .2s var(--ease-spring)}.tap:active{transform:scale(.94)}
.page-title{margin-top:48px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.page-title h1{margin:10px 0 0;font-size:clamp(56px,8vw,120px);line-height:.9}
.page-title h1 .motif{width:.32em;height:.32em;vertical-align:top;margin-left:10px;background:var(--acc);animation:floaty 7s ease-in-out infinite}
.page-title p{margin:14px 0 0;font-size:18px;color:var(--mute);max-width:560px}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* marquee */
.marquee{overflow:hidden;padding:22px 0;background:var(--acc);color:var(--fg-acc);transform:rotate(-1.5deg);margin:0 -40px}
.marquee-in{display:flex;gap:28px;width:max-content;white-space:nowrap;font-family:var(--font-display);font-weight:var(--display-weight);font-size:clamp(36px,5vw,64px);line-height:1;animation:marquee 34s linear infinite}
.marquee-in span{display:inline-flex;align-items:center;gap:28px}
.marquee-in i{width:.35em;height:.35em;clip-path:var(--motif);background:var(--acc2);display:inline-block}

/* ticket */
.ticket{position:relative;display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.ticket-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:21px 21px 0 0;border-bottom:1.5px dashed var(--line)}
.notch{position:absolute;top:33px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.notch.l{left:-11px}.notch.r{right:-11px}

/* checkbox com motif */
.check{display:flex;align-items:center;gap:12px;min-height:46px;cursor:pointer}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:26px;height:26px;flex:none;clip-path:var(--motif-solid);background:var(--ink);display:grid;place-items:center;transition:transform .25s var(--ease-spring)}
.check .box::before{content:"";width:20px;height:20px;clip-path:var(--motif-solid);background:var(--card);grid-area:1/1}
.check .box::after{content:"";width:14px;height:14px;clip-path:var(--motif-solid);background:transparent;grid-area:1/1;transition:background .2s}
.check input:checked+.box::after{background:var(--acc)}
.check input:checked+.box{animation:pop .3s var(--ease-spring)}
.check input:focus-visible+.box{outline:2.5px solid var(--acc);outline-offset:3px}
.check input:checked~.lbl{text-decoration:line-through;opacity:.5}

/* reveal (IntersectionObserver adiciona .in) */
.rv{opacity:0;transform:translateY(48px) scale(.97);transition:opacity .8s var(--ease-out),transform .9s var(--ease-spring)}
.rv.in{opacity:1;transform:none}
.gw{transform:scaleX(0);transform-origin:left center;transition:transform 1.1s var(--ease-out) .15s}
.in .gw,.gw.in{transform:scaleX(1)}
.gy{transform:scaleY(0);transform-origin:center bottom;transition:transform 1s var(--ease-spring)}
.in .gy{transform:scaleY(1)}
.dm{stroke-dasharray:10 10;animation:dashmove 8s linear infinite}

/* ============ keyframes ============ */
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(10deg)}}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes dashmove{to{stroke-dashoffset:-200}}
@keyframes popin{0%{transform:scale(.6) rotate(-6deg);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:none}}
@keyframes pop{40%{transform:scale(1.25)}}
@keyframes grain{0%,100%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(2%,2%)}}
@keyframes hint{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.view{animation:fadeIn .5s var(--ease-out) both}

/* ============ INÍCIO (scroll story) ============ */
.hero{height:260vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
.hero .pat{position:absolute;inset:0;opacity:.12}
.photo{position:absolute;inset:0;overflow:hidden;background:var(--deep);will-change:clip-path}
.photo svg.land{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 60%}
.photo .scrim{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.photo .ttl{position:absolute;left:var(--gutter);right:var(--gutter);bottom:clamp(32px,8vh,80px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;color:#fff}
.photo h1{margin:10px 0 0;font-size:clamp(56px,10vw,168px);line-height:.88}
.photo .btn{background:transparent;color:#fff;border-color:#fff}
.cd{position:absolute;display:flex;gap:clamp(12px,2vw,34px)}
.cd .u{display:flex;flex-direction:column;align-items:center;gap:8px}
.cd .n{font-family:var(--font-display);font-weight:var(--display-weight);font-size:clamp(44px,11vw,190px);line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd .l{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--mute)}
.cd-a{top:50%;right:calc(50% + clamp(26px,4vw,70px))}
.cd-b{top:50%;left:calc(50% + clamp(26px,4vw,70px))}
[data-split=h] .cd-a{top:auto;right:0;left:0;bottom:calc(50% + 30px);justify-content:center}
[data-split=h] .cd-b{left:0;right:0;top:calc(50% + 30px);justify-content:center}
.cd-label{position:absolute;top:108px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.22em}
.badge{position:absolute;left:var(--gutter);bottom:40px;width:132px;height:132px}
.badge svg{animation:spin 30s linear infinite}
.badge i{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);clip-path:var(--motif);background:var(--acc)}
.hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;letter-spacing:.22em}
.hint span:last-child{width:1.5px;height:40px;background:var(--ink);animation:hint 2s ease-in-out infinite}
.route{height:300vh;position:relative;background:var(--deep);color:var(--on-deep)}
.route .stage{padding:100px var(--gutter) 40px;display:flex;flex-wrap:wrap;align-items:center;gap:24px 56px}
.route .pat{position:absolute;right:-10%;top:-20%;width:60%;height:140%;opacity:.12;transform:rotate(8deg)}
.route-info{position:relative;flex:1 1 320px;display:flex;flex-direction:column;gap:16px;max-width:470px}
.route-info h2{margin:0;font-size:clamp(48px,6.5vw,108px);line-height:.92}
.segs{display:flex;gap:6px}.segs span{flex:1;height:4px;background:rgba(255,255,255,.2);transition:background .3s}
.route-tip{display:flex;gap:12px;align-items:flex-start;padding-left:16px;border-left:3px solid var(--route);line-height:1.5}
.route-tip .tag{border-color:var(--route)}
.route-map{position:relative;flex:2 1 460px;min-width:0;display:flex;justify-content:center}
.route-map svg{width:100%;max-height:66vh;overflow:visible}
.numbers{position:relative;overflow:hidden;min-height:120vh;padding:120px var(--gutter);display:flex;flex-direction:column;justify-content:center;gap:48px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:44px 32px}
.stat{position:relative;display:flex;flex-direction:column;gap:12px;padding-top:20px}
.stat::before{content:"";position:absolute;top:0;left:0;height:3px;width:calc(var(--p,0)*100%);background:var(--c)}
.stat b{font-family:var(--font-display);font-weight:var(--display-weight);font-size:clamp(48px,5.5vw,88px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute)}
.pending{position:relative;overflow:hidden;min-height:140vh;padding:120px var(--gutter);display:flex;flex-direction:column;justify-content:center}
.pending ul{list-style:none;margin:28px 0 0;padding:0;max-width:1100px}
.pending li{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:26px 0}
.pending li::before{content:"";position:absolute;top:0;left:0;height:1px;width:calc(var(--q,0)*100%);background:var(--ink);opacity:.25}
.pending .t{font-size:clamp(19px,2vw,26px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pending .s{font-size:15px;color:var(--mute);margin-top:4px}
.pending .go{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:500;text-decoration:none;border-bottom:1.5px solid var(--acc)}
.final{position:relative;overflow:hidden;min-height:100vh;padding:120px var(--gutter);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:32px;background:var(--acc);color:var(--fg-acc)}
.final .pat{position:absolute;inset:0;opacity:.14}
.final h2{position:relative;margin:0;font-size:clamp(60px,11vw,190px);line-height:.88}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:80;width:0}

/* ============ ROTEIRO ============ */
.segbar{display:flex;gap:6px;margin-top:36px}
.segbar button{min-width:0;min-height:64px;padding:10px 12px;border:0;border-radius:var(--r-md);text-align:left;cursor:pointer;transition:transform .35s var(--ease-spring),box-shadow .35s}
.segbar button[aria-pressed=true]{transform:translateY(-8px);box-shadow:0 8px 0 var(--ink)}
.segbar b{display:block;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.12em}
.segbar span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:flex;flex-wrap:wrap;gap:36px;margin-top:40px;align-items:flex-start}
.stops{flex:1 1 340px;display:flex;flex-direction:column}
.stop-btn{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);cursor:pointer}
.stop-btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.num{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.num i{position:absolute;inset:0;clip-path:var(--motif-solid)}
.num b{position:relative;font-family:var(--font-mono);font-weight:500;font-size:15px}
.leg{display:flex;align-items:center;gap:12px;padding:4px 0 4px 40px}
.leg span{font-family:var(--font-mono);font-size:12px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card)}
.detail{flex:999 1 560px;min-width:0;border-radius:var(--r-xl);overflow:hidden}
.detail-head{position:relative;overflow:hidden;padding:40px 36px 34px}
.detail-head h2{position:relative;margin:10px 0 0;font-size:clamp(52px,6.5vw,96px);line-height:.9;animation:popin .6s var(--ease-spring) both}
.detail-body{padding:30px 36px 36px;display:flex;flex-direction:column;gap:28px}
.pass{position:relative;display:flex;flex-wrap:wrap;border-radius:var(--r-lg);background:var(--bg);border:1px solid var(--line)}
.pass .notch{top:50%;margin-top:-11px;background:var(--card)}
.pass-main{flex:999 1 320px;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.pass-main .code{font-family:var(--font-display);font-weight:var(--display-weight);font-size:44px;line-height:1}
.pass-side{flex:1 1 150px;padding:24px 28px;border-left:1.5px dashed var(--line);display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:13px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--bg)}
.plan li i{width:12px;height:12px;flex:none;clip-path:var(--motif)}
.h3{margin:0 0 12px;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--mute)}
@media (max-width:600px){.segbar span{display:none}.segbar b{font-size:11px}}
@media (max-width:820px){.detail-head,.detail-body{padding-left:20px;padding-right:20px}.segbar button{min-height:54px;padding:8px}}

/* ============ DOCS ============ */
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:26px 22px;margin-top:28px}
.drop{position:relative;margin-top:64px;padding:60px 24px;border-radius:34px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;cursor:pointer}
.drop.over{background:var(--soft)}
.drop svg.bd{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.drop .ic{width:76px;height:76px;clip-path:var(--motif-solid);background:var(--acc);color:var(--fg-acc);display:grid;place-items:center;animation:floaty 7s ease-in-out infinite}
.shots{display:flex;flex-wrap:wrap;gap:24px}
.shots figure{margin:0;flex:1 1 170px;display:flex;flex-direction:column;gap:10px}
.shots .ph{aspect-ratio:1/1;display:grid;place-items:center}

/* ============ MALA ============ */
.ring{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;padding:24px;border-radius:26px;background:var(--deep);color:var(--on-deep)}
.ring circle.v{transition:stroke-dasharray .6s var(--ease-spring)}
fieldset.group{margin:0;padding:16px 20px 18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card)}
fieldset.group legend{padding:0 8px;font-family:var(--font-display);font-weight:var(--display-weight);font-size:20px}
.bar{height:16px;border-radius:var(--r-pill);background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-pill)}
.cols{display:flex;gap:12px;align-items:flex-end;height:170px}
.cols div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.cols i{width:100%;border-radius:14px 14px 4px 4px;display:block}
.sticker{width:130px;height:130px;clip-path:var(--motif-solid);background:var(--acc2);color:var(--fg-acc2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:wig 3.4s ease-in-out infinite}

/* ============ ONBOARDING ============ */
.ob{min-height:100vh;position:relative;overflow:hidden}
.ob .wrap{display:flex;flex-direction:column;gap:48px;padding-top:28px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:8px}
.steps li{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;padding:8px 12px;border-radius:var(--r-pill);border:1px solid var(--line)}
.steps li[aria-current=step]{background:var(--ink);color:var(--bg)}
.destcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:120px;padding:20px 22px;text-align:left;border-radius:20px;border:1.5px solid var(--line);background:rgba(255,255,255,.45);cursor:pointer;transition:all .3s}
.destcard[aria-pressed=true]{border-color:var(--acc);background:var(--bg)}
.gen-item{display:flex;align-items:center;gap:12px;font-size:18px;opacity:.15;transform:translateX(-12px);transition:all .5s var(--ease-out)}
.gen-item.on{opacity:1;transform:none}
.gen-item .ok{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;transition:background .3s}
.gen-item.on .ok{background:var(--acc2);color:var(--fg-acc2)}
.g{opacity:0;transform:translateY(20px);transition:all .6s var(--ease-out)}
.g.on{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.gw,.gy{transform:none}}

[data-route=inicio] .top{position:fixed;left:0;right:0}
@media (max-width:600px){.badge{display:none}}

      body = '<section class="view" style="display:flex;flex-wrap:wrap;gap:40px;align-items:stretch;padding-top:2vh"><div style="flex:1 1 300px;display:flex;flex-direction:column;gap:26px"><span class="eyebrow" style="color:inherit;opacity:.7" id="genLbl">Gerando · estilo ' + ob.style + '</span><h1 style="margin:0;font-size:clamp(36px,4vw,60px);font-weight:500;letter-spacing:-.03em;line-height:1">Criando a identidade da sua trilha</h1><p style="margin:0;font-size:17px;opacity:.8">A partir do destino, da época e do estilo da viagem, montamos cores, tipografia, padrão gráfico e o formato da fenda que abre a sua foto.</p><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px">' + src + '</ul></div>' +

        '<div class="g" data-ph="4" style="flex:1 1 140px;min-height:130px;border-radius:18px;overflow:hidden;background:var(--bg)">' + patSvg(k) + '</div>' +

  }
  function runGen() {

        '<div style="padding:22px;display:flex;flex-direction:column;gap:18px;background:' + t.bg + ';color:' + t.ink + ';flex:1"><div><div class="mono" style="font-size:11px;letter-spacing:.18em;opacity:.75">' + t.idName.toUpperCase() + '</div><div style="font-family:' + t.display + ';font-weight:' + t.dweight + ';font-size:44px;line-height:1;letter-spacing:-.02em;margin-top:6px">' + t.dest + '</div></div><div style="display:flex;gap:6px">' + sw + '</div>' +
        '<div style="display:flex;gap:12px"><div style="flex:1;height:90px;border-radius:14px;overflow:hidden;border:1px solid ' + t.line + '">' + patSvg(k) + '</div><div style="flex:1;height:90px;border-radius:14px;position:relative;overflow:hidden;border:1px solid ' + t.line + '"><div style="position:absolute;inset:0;background:' + t.deep + ';clip-path:' + t.miniClip + '"></div></div></div>' +
        '<div class="mono" style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;opacity:.75"><span>PADRÃO</span><span>FENDA · ' + t.shapeName.toUpperCase() + '</span></div>' +
        '<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px">' + t.sources.map(function (x) { return '<li style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;clip-path:' + t.motif + ';background:' + t.acc + '"></span>' + x + '</li>'; }).join('') + '</ul>' +
        '<button class="btn tap" style="margin-top:auto;background:' + t.ink + ';color:' + t.bg + ';border:0;justify-content:center" data-act="setDest" data-k="' + k + '" data-go="inicio">Usar esta identidade</button></div></article>'; }).join('');
    return shell('', '<div class="wrap"><section class="page-title"><div class="rv"><div class="eyebrow">Sistema de identidade por destino</div><h1 class="disp">Uma trilha, quatro caras.<span class="motif" aria-hidden="true"></span></h1><p>O que muda por destino: paleta, fonte display, padrão gráfico, formato da fenda e paisagem. O que fica: layout, fonte de texto, ritmo das animações e regras de contraste.</p></div></section>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:22px;margin-top:40px">' + cards + '</div></div>');
  }

  /* ================= roteador ================= */
  var ROUTES = { inicio: vInicio, roteiro: vRoteiro, documentos: vDocs, mala: vMala, diario: vDiario, onboarding: vOnboarding, identidades: vIdentidades };
  var lastRoute = null;
  function route() { var raw = location.hash || ''; var h = raw.replace(/^#\/?/, '').split('?')[0]; if (!ROUTES[h]) { h = (lastRoute && raw && raw.indexOf('#/') !== 0) ? lastRoute : (S.onboarded ? 'inicio' : 'onboarding'); } lastRoute = h; return h; }
  function render(opts) {
    opts = opts || {};
    timers.forEach(function (x) { clearInterval(x); clearTimeout(x); }); timers = []; scrollFn = null;
    var r = route();
    applyTheme(r === 'onboarding' ? (S.ob.dest || 'andes') : S.dest);
    if (r === 'onboarding' && !S.ob.dest) neutralTheme();
    var y = window.scrollY;
    document.body.setAttribute('data-route', r);
    app.innerHTML = ROUTES[r]() + '<svg class="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#gr)"></rect></svg><div id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;padding:14px 20px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:15px;max-width:min(520px,90vw);transition:all .4s var(--ease-spring);pointer-events:none"></div>';
    document.title = 'Trilha · ' + ({ inicio: 'Início', roteiro: 'Roteiro', documentos: 'Documentos', mala: 'Mala e gastos', diario: 'Diário', onboarding: 'Nova trilha', identidades: 'Identidades' })[r];
    if (opts.keep) { window.scrollTo({ top: y, behavior: 'instant' }); $$('.rv').forEach(function (el) { el.classList.add('in'); }); var mn = $('#main'); if (mn) mn.classList.remove('view'); }
    else { window.scrollTo({ top: 0, behavior: 'instant' }); observe(); }
    if (r === 'inicio') mountInicio();
    if (r === 'mala') updateConverter();
    if (r === 'onboarding' && S.ob.step === 2) runGen();
    if (!scrollFn) scrollFn = function () { parallax(); };
    scrollFn();
    save();
  }
  function neutralTheme() { var r = document.documentElement.style; r.setProperty('--bg', '#EEEBE4'); r.setProperty('--ink', '#1C1B19'); r.setProperty('--line', 'rgba(28,27,25,.18)'); r.setProperty('--acc', '#1C1B19'); r.setProperty('--font-display', 'inherit'); r.setProperty('--display-weight', '500'); r.setProperty('--motif', 'polygon(50% 0%,100% 50%,50% 100%,0% 50%)'); document.documentElement.removeAttribute('data-dark'); }
  var io = null;
  function observe() {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) { $$('.rv').forEach(function (el) { el.classList.add('in'); }); return; }
    io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    $$('.rv').forEach(function (el) { io.observe(el); });

  var ticking = false;
  window.addEventListener('scroll', function () { if (ticking) return; ticking = true; requestAnimationFrame(function () { ticking = false; if (scrollFn) scrollFn(); }); }, { passive: true });
  window.addEventListener('resize', function () { if (scrollFn) scrollFn(); });
  window.addEventListener('hashchange', function () { var h = location.hash; if (/^#\/[a-z]/.test(h) || h === '') render(); });
  function toast(msg) { var el = $('#toast'); if (!el) return; el.textContent = msg; el.style.opacity = 1; el.style.transform = 'translateX(-50%)'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.opacity = 0; el.style.transform = 'translateX(-50%) translateY(20px)'; }, 3200); }

  /* ================= ações ================= */
  var ACT = {
    menu: function (el) { var m = $('#idmenu'); var o = !m.classList.contains('open'); m.classList.toggle('open', o); el.setAttribute('aria-expanded', o); },
    setDest: function (el) { S.dest = el.getAttribute('data-k'); S.sel = 0; S.cat = 'Todos'; S.onboarded = true; if (el.getAttribute('data-go')) { location.hash = '#/' + el.getAttribute('data-go'); } else render({ keep: true }); toast('Identidade ' + D.themes[S.dest].idName + ' aplicada.'); },
    sel: function (el) { S.sel = +el.getAttribute('data-i'); render({ keep: true }); if (window.innerWidth < 900) { var d = $('.detail'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
    cat: function (el) { S.cat = el.getAttribute('data-c'); render({ keep: true }); },
    tab: function (el) { S.tab = el.getAttribute('data-k'); render({ keep: true }); },
    fav: function (el) { var on = el.getAttribute('aria-pressed') !== 'true'; el.setAttribute('aria-pressed', on); el.style.background = on ? 'var(--acc)' : 'transparent'; el.style.color = on ? 'var(--fg-acc)' : ''; el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 300 }); },
    toast: function (el) { toast(el.getAttribute('data-msg')); },
    obPick: function (el) { S.ob.dest = el.getAttribute('data-k'); S.ob.text = D.themes[S.ob.dest].dest; render({ keep: true }); },
    obNext: function () { if (S.ob.dest) { S.ob.step = 1; render(); } },
    obBack: function () { S.ob.step = Math.max(0, S.ob.step - 1); render(); },
    obStyle: function (el) { S.ob.style = el.getAttribute('data-k'); render({ keep: true }); },
    obGen: function () { S.ob.step = 2; render(); },
    obDone: function () { S.dest = S.ob.dest; S.onboarded = true; S.sel = 0; S.ob = { step: 0, dest: null, style: 'Mochilão', text: '' }; location.hash = '#/inicio'; }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    var m = $('#idmenu'); if (m && m.classList.contains('open') && !e.target.closest('#idmenu') && !e.target.closest('[data-act=menu]')) { m.classList.remove('open'); }
    if (!el) return; var a = el.getAttribute('data-act'); if (ACT[a]) { e.preventDefault(); ACT[a](el); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var m = $('#idmenu'); if (m) m.classList.remove('open'); } });
  document.addEventListener('submit', function (e) {
    var f = e.target, a = f.getAttribute('data-submit'); if (!a) return; e.preventDefault(); var fd = new FormData(f);
    if (a === 'addStop') {
      var city = String(fd.get('city')).trim(), d1 = new Date(fd.get('a')), d2 = new Date(fd.get('b'));
      var n = Math.max(1, Math.round((d2 - d1) / 864e5)); var mo = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
      var fmt = function (d) { return ('0' + d.getUTCDate()).slice(-2) + ' ' + mo[d.getUTCMonth()]; };
      var t = T(); var prev = t.stops[t.stops.length - 1];
      var st = { city: city, country: 'Parada adicionada', dates: fmt(d1) + ' → ' + fmt(d2), nights: n + (n > 1 ? ' noites' : ' noite'), n: n, meta: 'nova parada', leg: '', tip: 'Nova parada! Na versão final a IA sugere o que fazer aqui, como chegar e onde dormir.', code: city.slice(0, 3).toUpperCase(), plan: ['Chegada em ' + city], stay: 'Hospedagem em ' + city, stayStatus: 'Sem reserva', tfrom: prev.code, tto: city.slice(0, 3).toUpperCase(), tmode: String(fd.get('m')).toUpperCase(), tdep: '[HORÁRIO]', tarr: '[HORÁRIO]' };
      S.extraStops[t.key] = (S.extraStops[t.key] || []).concat([st]);
      var ex = S.extraStops[t.key]; if (ex.length > 1) ex[ex.length - 2].leg = String(fd.get('m')) + ' · [TEMPO]';
      S.sel = t.stops.length; render({ keep: true }); toast(city + ' entrou no roteiro.');
    }
    if (a === 'addItem') { var t2 = T(); var lbl = String(fd.get('item')).trim(); if (!lbl) return; var arr = S.extraItems[t2.key] || []; arr.push({ id: 'x' + Date.now(), label: lbl, on: false, ai: false }); S.extraItems[t2.key] = arr; render({ keep: true }); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, a = el.getAttribute && el.getAttribute('data-change'); if (!a) return;

    if (a === 'photo' && el.files[0]) { var rd = new FileReader(); rd.onload = function () { S.photos[S.dest] = rd.result; render({ keep: true }); toast('Foto aplicada. Role pra ver a fenda abrir.'); }; rd.readAsDataURL(el.files[0]); }
    if (a === 'files') addFiles(el.files);
  });
  document.addEventListener('input', function (e) {
    var el = e.target, a = el.getAttribute && el.getAttribute('data-input'); if (!a) return;
    if (a === 'amt') { S.amt = el.value; updateConverter(); save(); }
    if (a === 'search') { var q = el.value.toLowerCase(); $$('#docgrid .ticket').forEach(function (c) { c.style.display = c.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none'; }); }
    if (a === 'obText') { S.ob.text = el.value; var v = el.value.toLowerCase(), hit = null; for (var k in MATCH) if (MATCH[k].test(v)) hit = k; var msg = $('#obMsg');
      if (hit && hit !== S.ob.dest) { S.ob.dest = hit; applyTheme(hit); $$('.destcard').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-k') === hit); }); var nb = $('[data-act=obNext]'); nb.disabled = false; nb.style.opacity = 1; }
      if (msg) msg.textContent = hit ? 'IDENTIDADE ENCONTRADA NO DICIONÁRIO: ' + D.themes[hit].idName.toUpperCase() : (v.length > 3 ? 'FORA DO DICIONÁRIO: NA VERSÃO FINAL A IA GERA UMA IDENTIDADE NOVA' : ''); }
  });
  function addFiles(files) {
    var t = T(); var list = S.extraDocs[t.key] || []; var last = '';
    Array.prototype.forEach.call(files, function (f) { var c = classify(f.name, t); var kb = Math.max(1, Math.round(f.size / 1024));
      list.unshift({ cat: c.cat, title: f.name.replace(/\.[^.]+$/, ''), sub: c.stop ? c.stop.city + ' · ligado automaticamente' : 'Sem parada ligada', meta: (f.name.split('.').pop() || '').toUpperCase() + ' · ' + (kb > 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : kb + ' KB') });
      last = 'Identificado como ' + c.cat + (c.stop ? ' e ligado a ' + c.stop.city : '') + '.'; });
    S.extraDocs[t.key] = list; S.cat = 'Todos'; render({ keep: true }); toast(last);
  }
  var drop = null;
  document.addEventListener('dragover', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); } });

  render();
})();
